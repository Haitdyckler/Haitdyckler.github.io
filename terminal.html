<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Hub</title>
    <link rel="stylesheet" href="css/terminal_style.css">
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">&lt;user&gt;</div>
        <div class="terminal-output" id="output"></div>
        <div class="terminal-input-line">
            <span class="prompt">$</span>
            <input type="text" id="terminal-input" autofocus>
        </div>
    </div>

    <div class="sidebar">
        <div class="info-box globe-box">
            <div class="info-content">
                <div id="globe-container"></div>
            </div>
        </div>

        <div class="info-box time-box">
            <div class="info-header">Time</div>
            <div class="info-content">
                <div id="time-display">--:--:--</div>
            </div>
        </div>

        <div class="info-box score-box">
            <div class="info-header">Score</div>
            <div class="info-content">
                <div id="wpm-display">0 WPM</div>
                <div id="accuracy-display" style="margin-top: 10px; font-size: 12px;">0% accuracy</div>
            </div>
        </div>
    </div>
    <script src="js/terminal.js"></script>
</body>
</html>
